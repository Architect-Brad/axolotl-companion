<html lang="en">
<head>

<title>Pixel axolotl</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}

:root[data-theme="dark"]{--bg:#1d1418;--fg:#f4c9d4;--sh:rgba(0,0,0,.4);--bt:#2a1d23;--bd:#4a3039;--on:#7a3b50}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
svg{width:min(82vw,360px);height:auto;cursor:pointer}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--bt);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer}
button.on{background:var(--on);border-color:var(--on)}
p{margin:0;font-size:13px;opacity:.7}
.b-idle{animation:b 1.2s ease-in-out infinite}
.b-sleep{animation:b 3.2s ease-in-out infinite}
.b-happy{animation:hop .5s ease-in-out infinite}
.b-surp{animation:sh .12s linear infinite}
.gl,.gr{animation:w var(--gs,.6s) steps(2,jump-none) infinite alternate}
.gr{animation-delay:.2s}
.b-dance{animation:dance .8s ease-in-out infinite}.b-type{animation:nod .5s ease-in-out infinite}
.b-jump{animation:jump .9s cubic-bezier(.3,.7,.4,1) infinite}
.tw{animation:tw 1s ease-in-out infinite}
.rise{animation:rise 2s ease-out infinite}
@keyframes dance{0%,100%{transform:translate(-8px,0)}25%{transform:translate(0,-10px)}50%{transform:translate(8px,0)}75%{transform:translate(0,-10px)}}@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%,55%{transform:translateY(-30px)}}
@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes sh{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes w{0%{transform:translateY(0)}100%{transform:translateY(-5px)}}
@keyframes tw{0%,100%{opacity:0}50%{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
input{font:inherit;font-size:14px;color:var(--fg);background:var(--bt);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;width:190px}
#pal{display:flex;gap:10px}#accb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:360px}.sw{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--bd)}.sw.cur{border-color:var(--fg)}
#task{display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
